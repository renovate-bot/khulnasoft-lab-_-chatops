---
image: ruby:2.7-alpine

include:
  # Upgrades dependencies on a schedule
  # see https://gitlab.com/gitlab-com/gl-infra/common-ci-tasks/-/blob/main/renovate-bot.md
  - project: 'gitlab-com/gl-infra/common-ci-tasks'
    ref: v1.79.1 # renovate:managed
    file: renovate-bot.yml
    rules:
      - if: '$CI_SERVER_HOST == "gitlab.com"'

stages:
  - validate       # renovate_bot validation stage
  - renovate_bot
  - test
  - build

.chatops: &chatops
  image:
    name: $CI_REGISTRY_IMAGE:latest
    pull_policy: always
  variables:
    GIT_STRATEGY: none
    GIT_SUBMODULE_STRATEGY: none
  rules:
    - if: '$CI_PIPELINE_SOURCE == "chat"'
      when: 'always'
    - when: 'never'
  tags:
    - chatops
  script:
    - cd /app
    - bundle exec ruby /app/bin/chatops $CI_JOB_NAME

.ruby: &ruby
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "chat" || $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: 'never'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: 'always'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      when: 'always'
  before_script:
    - apk add --update build-base postgresql-dev
    - gem install bundler --no-document
    - ruby --version
    - gem --version
    - bundle --version
    - bundle install --path vendor --retry=3
  cache:
    paths:
      - vendor/ruby

build:image:
  services:
    - docker:dind
  stage: build
  image: docker:git
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
      when: 'never'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: 'always'
    - if: '$RENOVATE_SCHEDULED || $RENOVATE_IMMEDIATE'
      when: 'never'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: 'never'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      when: 'always'
  script:
    - ./bin/docker "${CI_REGISTRY_IMAGE}:latest"

rspec:
  <<: *ruby
  stage: test
  script:
    - bundle exec rake coverage
  services:
    - postgres:latest
  variables:
    # Configure the "postgres" service itself.
    POSTGRES_DB: chatops
    POSTGRES_USER: runner
    POSTGRES_PASSWORD: runner-password
    # Configure the test environment to connect to said service.
    TEST_DATABASE_HOST: postgres
    TEST_DATABASE_USER: runner
    TEST_DATABASE_NAME: chatops
    TEST_DATABASE_PASSWORD: runner-password
    COVERAGE: 'true'

rubocop:
  <<: *ruby
  stage: test
  script:
    - bundle exec rubocop

batched_background_migrations:
  <<: *chatops

broadcast:
  <<: *chatops

explain:
  <<: *chatops

feature:
  <<: *chatops

graph:
  <<: *chatops

help:
  <<: *chatops

publish:
  <<: *chatops

query:
  <<: *chatops

user:
  <<: *chatops

deploy:
  <<: *chatops

member:
  <<: *chatops

oncall:
  <<: *chatops

canary:
  <<: *chatops

release:
  <<: *chatops

gitaly:
  <<: *chatops

namespace:
  <<: *chatops

auto_deploy:
  <<: *chatops

post_deploy_migrations:
  <<: *chatops

helm:
  <<: *chatops

deploycmd:
  <<: *chatops

mirror:
  <<: *chatops

annotate:
  <<: *chatops

hotpatch:
  <<: *chatops

database:
  <<: *chatops

rollback:
  <<: *chatops

notify:
  image:
    name: $CI_REGISTRY_IMAGE:latest
    pull_policy: always
  variables:
    GIT_STRATEGY: none
    GIT_SUBMODULE_STRATEGY: none
  rules:
    - if: $CI_PIPELINE_SOURCE == 'chat' || $CI_PIPELINE_SOURCE == 'api'
    - if: $TRIGGER_NOTIFY == 'true'
  tags:
    - chatops
  script:
    - cd /app
    - bundle exec ruby /app/bin/chatops $CI_JOB_NAME

production_checks:
  <<: *chatops

pager:
  <<: *chatops

quality:
  <<: *chatops

zoekt:
  <<: *chatops

search_migrations:
  <<: *chatops

migrations:
  <<: *chatops

# make sure we keep renovate bot image updated when
# 'gitlab-com/gl-infra/common-ci-tasks' updates its base images, we
# need a second release to have the correct image applied to the
# imported tag. With this direct override we have more control over
# the image version
.base_renovate_image:
  image:
    name: registry.gitlab.com/gitlab-com/gl-infra/common-ci-tasks/renovate:v1.79.1
